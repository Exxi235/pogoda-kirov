info:
  name: погода киров copy
  type: http
  seq: 2

http:
  method: GET
  url: https://api.open-meteo.com/v1/forecast?latitude={{lat}}&longitude={{lon}}&current=temperature_2m
  params:
    - name: latitude
      value: "{{lat}}"
      type: query
    - name: longitude
      value: "{{lon}}"
      type: query
    - name: current
      value: temperature_2m
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // 1. Получаем данные
        const data = res.getBody();

        if (res.status === 200 && data.current) {
            const temp = data.current.temperature_2m;
            const city = bru.getEnvVar("city");
            const token = bru.getEnvVar("tg_token");
            const chatId = bru.getEnvVar("tg_chat_id");

            // 2. Логика советов (наш новый "умный" блок)
            let advice = "";
            if (temp < 0) {
                advice = "❄️ На улице мороз! Одевайся как полярник!";
            } else if (temp < 10) {
                advice = "🧥 Холодно, без куртки не выходи.";
            } else if (temp < 20) {
                advice = "🍃 Прохладно, лучше накинуть ветровку.";
            } else {
                advice = "☀️ Погода — кайф! Можно идти в футболке.";
            }

            // 3. Формируем сообщение (используем обратные кавычки ` для красоты)
            const message = `🌤 Погода в г. ${city}
        🌡 Температура: ${temp}°C

        ${advice}`;

            // 4. Отправка в Telegram
            if (token && chatId) {
                axios.post(`https://api.telegram.org/bot${token}/sendMessage`, {
                    chat_id: chatId,
                    text: message
                })
                .then(() => console.log("✅ Сообщение с советом отправлено!"))
                .catch((err) => console.log("❌ Ошибка Telegram: " + err.message));
            }
        } else {
            console.log("❌ Ошибка: Проверь окружение или включи VPN!");
        }
    - type: tests
      code: |-
        test("Киров ответил успешно", function() {
          // Проверяем, что сервер выдал статус 200 (ОК)
          expect(res.getStatus()).to.equal(200);
        });

        test("В ответе есть данные о температуре", function() {
          const data = res.getBody();
          // Проверяем, что в данных есть поле temperature_2m
          expect(data.current.temperature_2m).to.be.a('number');
        });
        const data = res.getBody();
        const temp = data.current.temperature_2m;
        const city = bru.getEnvVar("city");

        test("Погода в городе " + city + "комфортная для прогулок", function() {
          // Допустим, мы считаем, что выше +35°C — это уже слишком жарко
          expect(temp).to.be.below(35);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
