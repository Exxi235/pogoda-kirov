info:
  name: погода киров
  type: http
  seq: 1

http:
  method: GET
  url: https://api.open-meteo.com/v1/forecast?latitude={{lat}}&longitude={{lon}}&current=temperature_2m
  params:
    - name: latitude
      value: "{{lat}}"
      type: query
    - name: longitude
      value: "{{lon}}"
      type: query
    - name: current
      value: temperature_2m
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
          if (data.current) {
              const temp = data.current.temperature_2m;
              const city = bru.getEnvVar("city");
              const token = bru.getEnvVar("tg_token");
              const chatId = bru.getEnvVar("tg_chat_id");

              let advice = "";
              if (temp < 0) { advice = "❄️ На улице мороз! Одевайся как полярник!"; }
              else if (temp < 10) { advice = "🧥 Холодно, надень куртку."; }
              else if (temp < 20) { advice = "🍃 Прохладно, лучше накинуть ветровку."; }
              else { advice = "☀️ Погода — кайф! Можно идти в футболке."; }

              const message = `🌤 Погода в г. ${city}\n🌡 Температура: ${temp}°C\n\n${advice}`;

              if (token && chatId) {
                  await axios.post(`https://api.telegram.org/bot${token}/sendMessage`, {
                      chat_id: chatId,
                      text: message
                  });
              }
          }
